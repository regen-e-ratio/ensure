openapi: 3.1.0
info:
  title: Ensure API
  version: 2.0.0
  description: >
    Backend API for the note web app (foundation for a future deadman switch).
    Each signed-in user has at most one note of their own, stored encrypted at rest
    (feature 004-note-ownership-encryption); reads and writes are scoped to the
    authenticated user, so no endpoint can address another user's note. Gated behind
    Google SSO (feature 002-google-sso-auth): sign-in is Google-only; the access token
    is a ~1h JWT carried in an httpOnly cookie, silently refreshed while the user is
    active, with a ~24h inactivity window.
servers:
  - url: /api
    description: API root (same-origin in dev and single-instance deploy)
paths:
  /auth/google/start:
    get:
      operationId: authGoogleStart
      summary: Begin Google sign-in
      description: >
        Sets a short-lived signed httpOnly cookie carrying the OAuth `state` and PKCE
        code_verifier, then 302-redirects the browser to Google's consent screen. The
        "Sign in with Google" button links here. Accepts an optional `next` query param to
        return the user to their originally requested path after sign-in (FR-010).
      parameters:
        - in: query
          name: next
          required: false
          schema: { type: string }
          description: App-relative path to return to after successful sign-in.
      responses:
        "302":
          description: Redirect to Google's authorization endpoint.

  /auth/google/callback:
    get:
      operationId: authGoogleCallback
      summary: Google OAuth redirect target
      description: >
        Google redirects here with `code` and `state`. The server validates `state` against the
        handshake cookie, exchanges the code (PKCE) for tokens, verifies the ID token,
        provisions/looks up the user, issues the access + refresh cookies, and 302-redirects into
        the app (to `next` when present, else `/`). On failure, redirects to /login with an error
        flag (FR-013).
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
          description: Present when the user cancelled or Google denied the request.
      responses:
        "302":
          description: Redirect into the app on success, or back to /login on failure.

  /auth/me:
    get:
      operationId: authMe
      summary: Current authenticated user
      description: Returns the signed-in user, or 401 if there is no valid session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Silently refresh the access token
      description: >
        Reads the refresh-token cookie; if the backing session exists and has not expired
        (within the ~24h sliding inactivity window), rotates the refresh token, slides its expiry
        forward 24h, and issues a new ~1h access-token cookie. Otherwise returns 401 and the
        client routes the user to /login (FR-014, FR-017, SC-007, SC-008).
      responses:
        "204":
          description: New access (and rotated refresh) cookies set; no body.
        "401":
          description: Missing/expired/revoked refresh token — re-authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "UNAUTHORIZED", message: "Session expired. Please sign in again." }

  /auth/logout:
    post:
      operationId: authLogout
      summary: Sign out
      description: >
        Deletes the current server-side session and clears both auth cookies. Idempotent —
        returns 204 even if there was no active session (FR-012, SC-006).
      responses:
        "204":
          description: Session ended and cookies cleared.

  /note:
    get:
      operationId: getNote
      summary: Get the caller's own note (per-user, encrypted at rest)
      description: >
        Returns the authenticated caller's own note (decrypted), or null when they
        have not saved one yet (so the client can render an empty state). The note is
        always scoped to the caller — another user's note is never returned. Requires
        a valid access token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current note, or null if none exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
              examples:
                exists:
                  summary: A note exists
                  value:
                    note:
                      text: "Remember to water the plants.\nKeys are with Sam."
                      createdAt: "2026-06-05T09:12:00.000Z"
                      updatedAt: "2026-06-05T10:30:00.000Z"
                empty:
                  summary: No note saved yet
                  value:
                    note: null
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
        "500":
          description: >
            The caller's note could not be decrypted — its key version is unavailable
            or the authentication tag failed. The server fails closed: it never returns
            the content as plaintext.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                { error: "NOTE_DECRYPT_FAILED", message: "The note could not be decrypted." }
    put:
      operationId: putNote
      summary: Create or replace the caller's own note (per-user, encrypted at rest)
      description: >
        Saves the provided text as the caller's own note, encrypted with the active
        key version. Creates it if none exists, otherwise replaces the text in place
        (last-write-wins); a note sealed under an older key version is re-encrypted to
        the active version on save (lazy migration). Rejects empty/whitespace-only text
        and text longer than 10000 characters (enforced before encryption). Requires a
        valid access token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
            examples:
              valid:
                value:
                  text: "Remember to water the plants."
      responses:
        "200":
          description: The note was saved; returns the stored note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
              example:
                note:
                  text: "Remember to water the plants."
                  createdAt: "2026-06-05T09:12:00.000Z"
                  updatedAt: "2026-06-05T10:30:00.000Z"
        "400":
          description: Validation failed (empty/whitespace-only, missing, or too long).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                empty:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Note text is required."
                tooLong:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Note text must be at most 10000 characters."
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }

  /contact:
    get:
      operationId: getContacts
      summary: Get the caller's own contact list
      description: >
        Returns the authenticated caller's own contacts (may be empty), ordered by
        creation time. Contacts are always scoped to the caller — another user's
        contacts are never returned. Requires a valid access token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
              examples:
                some:
                  summary: A few email contacts
                  value:
                    contacts:
                      - id: "f3b1c2d4-0000-4000-8000-000000000001"
                        type: "email"
                        value: "Alice@Example.com"
                        createdAt: "2026-06-07T09:12:00.000Z"
                empty:
                  summary: No contacts yet
                  value:
                    contacts: []
    post:
      operationId: addContact
      summary: Add a contact to the caller's own list
      description: >
        Adds a contact (only type "email" is accepted in this release) to the caller's
        list and returns the stored contact. The email is stored as entered (trimmed,
        original case preserved); duplicate detection is case-insensitive. Rejects an
        unsupported type, a malformed email, a value longer than 320 characters, a
        duplicate, or an add that would exceed the 50-contact limit. Requires a valid
        access token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
            examples:
              valid:
                value:
                  type: "email"
                  value: "alice@example.com"
      responses:
        "201":
          description: The contact was added; returns the stored contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
              example:
                id: "f3b1c2d4-0000-4000-8000-000000000001"
                type: "email"
                value: "alice@example.com"
                createdAt: "2026-06-07T09:12:00.000Z"
        "400":
          description: Validation failed (missing fields, unsupported type, malformed email, or too long).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidEmail:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Enter a valid email address."
                tooLong:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Email must be at most 320 characters."
        "409":
          description: The contact already exists, or the caller has reached the 50-contact limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                duplicate:
                  value:
                    error: "DUPLICATE_CONTACT"
                    message: "That contact is already in your list."
                limit:
                  value:
                    error: "CONTACT_LIMIT_REACHED"
                    message: "You can have at most 50 contacts."
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
  /contact/{id}:
    delete:
      operationId: removeContact
      summary: Remove a contact from the caller's own list
      description: >
        Removes the identified contact from the caller's list. Idempotent: returns 204
        whether or not a matching contact existed. A contact owned by another user is
        treated exactly like a non-existent one (204 no-op), so one user can never
        affect or probe another's contacts. Requires a valid access token.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: The id of the contact to remove.
      responses:
        "204":
          description: The contact was removed, or no matching contact existed (idempotent).
  /contact/verify:
    get:
      operationId: confirmContactVerification
      summary: Confirm a contact verification link (public, token-only)
      description: >
        PUBLIC (no session) endpoint that confirms control of a contact's address from the
        link emailed by POST /contact/{id}/verify. Authority comes entirely from possession
        of the unguessable token: the server hashes the supplied token, looks the contact up
        by that hash, and uses no caller-supplied contact id or session. On a valid, unexpired,
        unused token it sets the contact's `verified_at` and returns `verified` (or
        `already_verified` if it was already confirmed). A missing, malformed, unknown, expired,
        or already-used token yields a generic `invalid_or_expired` result that discloses
        nothing about whether any contact or owner exists (fail-closed). The raw token is never
        logged or echoed.
      parameters:
        - in: query
          name: token
          required: false
          schema: { type: string }
          description: The one-time verification token carried by the emailed link.
      responses:
        "200":
          description: The verification outcome (success, already-verified, or invalid/expired).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactVerifyResult"
              examples:
                verified:
                  value: { status: "verified" }
                alreadyVerified:
                  value: { status: "already_verified" }
                invalid:
                  value: { status: "invalid_or_expired" }
  /contact/{id}/verify:
    post:
      operationId: sendContactVerification
      summary: Send (or resend) a verification email to one of the caller's contacts
      description: >
        Mints a high-entropy token, stores only its SHA-256 hash plus a future expiry on the
        owned contact, and sends a verification email through the generic notify() dispatcher
        (email channel) whose body carries a single APP_BASE_URL link with the raw token shown
        once. Scoped to the caller (`req.user.id`): a contact id that is not the caller's own
        is treated as not-found (404) and no email is sent. Resending is allowed and refreshes
        the token (overwriting the prior hash + expiry), invalidating any earlier link. Requires
        a valid access token.
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: The id of the caller's contact to verify.
      responses:
        "200":
          description: The verification email was dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactVerifySendResponse"
              example: { sent: true }
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
        "404":
          description: No such contact for the caller (no email sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "NOT_FOUND", message: "Contact not found." }
        "502":
          description: The verification email could not be dispatched; the contact stays unverified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "EMAIL_SEND_FAILED", message: "Could not send the verification email. Please try again." }
  /notifications/channels:
    get:
      operationId: getNotificationChannels
      summary: List notification channels and their fields
      description: >
        Returns every known notification channel with its availability and the input fields
        it requires, so the test page can render its selector and per-channel form from a
        single server-side source of truth. In v1 only Email is available; WhatsApp and push
        are listed as unavailable (cannot be selected to send). Requires a valid access token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The channels and their field descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelsResponse"
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
  /notifications/test:
    post:
      operationId: sendTestNotification
      summary: Send a notification through the generic capability
      description: >
        Invokes the same generic notification capability any caller uses, with a channel,
        recipient, and content. Returns an explicit outcome (sent, or failed with a
        human-readable reason). Invalid input is rejected with 400 before any delivery is
        attempted; a known-but-disabled channel returns 400 CHANNEL_NOT_SUPPORTED; a
        provider rejection/timeout is reported as a 200 outcome with status "failed".
        Requires a valid access token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTestRequest"
            examples:
              email:
                value:
                  channel: "email"
                  recipient: "person@example.com"
                  subject: "Test notification"
                  body: "Hello from the notification system."
                  bodyFormat: "text"
      responses:
        "200":
          description: Delivery was attempted; the outcome (sent or failed) is reported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOutcomeResponse"
              examples:
                sent:
                  value:
                    outcome: { status: "sent", channel: "email", providerMessageId: "stub-accepted" }
                failed:
                  value:
                    outcome:
                      { status: "failed", channel: "email",
                        reason: "The email provider did not respond in time." }
        "400":
          description: >
            Validation failed (invalid email, empty/oversized subject or body, bad format) —
            no delivery attempted — or the requested channel is known but not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validation:
                  value: { error: "VALIDATION_ERROR", message: "Recipient must be a valid email address." }
                unsupported:
                  value: { error: "CHANNEL_NOT_SUPPORTED", message: "The 'whatsapp' channel is not available yet." }
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }

  /deadman:
    get:
      operationId: getDeadmanStatus
      summary: Get the caller's own dead-man switch status
      description: >
        Returns the authenticated caller's dead-man switch status — the current state
        (disarmed/active/grace/triggered), the configured interval and grace period, the
        absolute deadlines, a derived secondsUntilDue countdown, and the most recent
        events newest-first. A user who has never configured the switch gets a 200 with
        the default interval/grace, state "disarmed", and null deadlines. Always scoped to
        the caller — another user's switch is never returned. Requires a valid access token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's switch status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadmanStatus"
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
  /deadman/config:
    put:
      operationId: putDeadmanConfig
      summary: Configure, arm, or disarm the caller's own dead-man switch
      description: >
        Sets the caller's check-in interval and grace period (each validated against the
        shared min/max bounds) and, via `enabled`, arms or disarms the switch. Arming
        (enabled:true) transitions a disarmed switch to "active" and sets nextCheckinDueAt
        to now + interval; disarming (enabled:false) transitions to "disarmed" and clears
        the live deadlines. An out-of-bounds interval or grace is rejected with 400
        VALIDATION_ERROR and no change. Records an armed/disarmed/config_changed event.
        Requires a valid access token.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadmanConfigInput"
            examples:
              arm:
                value: { checkinIntervalSeconds: 604800, gracePeriodSeconds: 172800, enabled: true }
      responses:
        "200":
          description: The configuration was applied; returns the updated status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadmanStatus"
        "400":
          description: Validation failed (interval/grace out of bounds, missing, or non-integer).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "VALIDATION_ERROR", message: "Check-in interval is out of range." }
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
  /deadman/checkin:
    post:
      operationId: checkinDeadman
      summary: Check in ("I'm alive") on the caller's own dead-man switch
      description: >
        Resets the caller's switch on an active or grace switch — sets lastCheckinAt to
        now, moves nextCheckinDueAt to now + interval, returns the state to "active",
        clears grace bookkeeping, and records a checkin event. Rejected with 409 when the
        switch is disarmed (no live deadline) or already triggered (cannot un-fire).
        Requires a valid access token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The check-in was recorded; returns the updated status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadmanStatus"
        "409":
          description: The switch is disarmed or already triggered, so a check-in does not apply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                disarmed:
                  value: { error: "NOT_ARMED", message: "The switch is not armed." }
                triggered:
                  value: { error: "ALREADY_TRIGGERED", message: "The switch has already fired." }
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
  /deadman/test-release:
    post:
      operationId: testReleaseDeadman
      summary: Preview the recipient experience by sending a test release to your own contacts
      description: >
        Mints a one-time grant to each of the caller's OWN verified contact address(es), creates
        a release tagged `manual_test`, and emails each a tokenized `${APP_BASE_URL}/r/{token}`
        link via the generic notify() dispatcher — WITHOUT changing the switch state — so a user
        can preview exactly what their contacts will receive when the switch fires (feature 010,
        the CTA feature 012 integrates). Scoped to the caller (`req.user.id`); sends only to the
        caller's own verified addresses. Returns the number of grants created. Rejected with 409
        when the caller has no verified contact (no email is sent). Requires a valid access token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: A test release was created and emailed to the caller's own verified contact(s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestReleaseResult"
              example: { grants: 1 }
        "401":
          description: No valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
        "409":
          description: The caller has no verified contact, so there is nobody to send a test release to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "NO_VERIFIED_CONTACT", message: "Verify a contact before sending a test release." }
  /release/{token}:
    get:
      operationId: openRelease
      summary: Open a one-time release link to read the note (public, token-only, view-once)
      description: >
        PUBLIC (no session) endpoint a verified contact opens from the tokenized link emailed
        when a switch fires (feature 010). Authority is possession of the unguessable token only:
        the server hashes the supplied token, looks the grant up by hash, and — only when the
        grant is valid, unviewed, and unexpired — decrypts the note owner's note server-side via
        the keyring, marks the grant viewed (view-once), and returns the note exactly once. A
        second open, or an expired grant, yields 410 Gone. A missing/malformed/unknown token
        yields a generic not-available result disclosing nothing. A decrypt failure fails closed
        with 500 and leaves the grant unviewed (retryable) — the note plaintext is never leaked.
        The route is rate-limited. The raw token is never logged or echoed.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
          description: The one-time release-grant token carried by the emailed link.
      responses:
        "200":
          description: The grant was valid and unviewed; the decrypted note is returned exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseView"
        "404":
          description: No grant matches the token (unknown or malformed) — discloses nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "NOT_AVAILABLE", message: "This link is not available." }
        "410":
          description: The grant has already been viewed or has expired (view-once / time-limited).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "GONE", message: "This link is no longer available." }
        "500":
          description: The note could not be decrypted; fail-closed, the grant stays unviewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "DECRYPT_FAILED", message: "This message could not be opened. Please try again." }

  /test/login:
    post:
      operationId: testLogin
      summary: "[TEST MODE ONLY] Mint a session for a fake user without contacting Google"
      description: >
        Mounted ONLY when AUTH_TEST_MODE=1 (never in production), mirroring the existing
        NOTE_ALLOW_TEST_RESET / POST /api/test/reset pattern. Issues the SAME access + refresh
        cookies as the real Google flow for a deterministic fake user, so end-to-end and contract
        tests can exercise the real authorization middleware and cookie handling without
        automating Google's consent screen. See research.md D6.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sub: { type: string, description: "Fake user id (default: e2e-user)." }
                email: { type: string, format: email }
                name: { type: ["string", "null"] }
      responses:
        "204":
          description: Access + refresh cookies set for the fake user.
        "404":
          description: Route is not mounted (AUTH_TEST_MODE is off).

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        httpOnly, Secure, SameSite=Lax cookie holding the ~1h access-token JWT. Set by the Google
        callback (and by the test-login route in test mode), refreshed via POST /auth/refresh.
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          description: Stable Google subject identifier (sub).
        email:
          type: string
          format: email
        name:
          type: ["string", "null"]
          description: Optional display name from Google.
    Note:
      type: object
      additionalProperties: false
      required: [text, createdAt, updatedAt]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description: The note content, plain text, stored exactly as entered.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of first creation.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the last save.
    NoteResponse:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          oneOf:
            - $ref: "#/components/schemas/Note"
            - type: "null"
          description: The current note, or null when none has been saved.
    NoteInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description: >
            Proposed note text. Must contain at least one non-whitespace character
            (the server trims only to check emptiness; the stored value is verbatim).
    Contact:
      type: object
      additionalProperties: false
      required: [id, type, value, createdAt, verified, verifiedAt]
      properties:
        id:
          type: string
          description: Server-assigned unique id for this contact (used to remove it).
        type:
          type: string
          enum: [email]
          description: >
            Contact type. Only "email" is supported in this release; the field exists so
            future types (phone, username) can be added without changing existing contacts.
        value:
          type: string
          maxLength: 320
          description: The email address as entered (trimmed, original case preserved for display).
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of when the contact was added.
        verified:
          type: boolean
          description: >
            Whether the contact has proven control of its address (feature 009). Derived
            from `verified_at != null`; every pre-existing contact is unverified by default.
            Only verified contacts ever receive a release (feature 010).
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 UTC timestamp of when the contact was verified, or null if unverified.
            The internal verification token hash and expiry are never serialized.
    ContactInput:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          enum: [email]
          description: Only "email" is accepted in this release.
        value:
          type: string
          minLength: 1
          maxLength: 320
          description: A well-formed email address.
    ContactListResponse:
      type: object
      additionalProperties: false
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
          description: The caller's contacts, ordered by creation time (may be empty).
    ContactVerifySendResponse:
      type: object
      additionalProperties: false
      required: [sent]
      properties:
        sent:
          type: boolean
          description: >
            True when the verification email was dispatched through the generic notify()
            dispatcher to the contact's address (feature 009).
    ContactVerifyResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [verified, already_verified, invalid_or_expired]
          description: >
            Outcome of opening a public verification link. `verified` — the contact was just
            confirmed; `already_verified` — a valid link for an already-confirmed contact
            (idempotent); `invalid_or_expired` — the token was missing, malformed, unknown,
            expired, or already used (fail-closed; discloses no contact/owner existence).
    ReleaseView:
      type: object
      additionalProperties: false
      required: [note]
      description: >
        The one-time decrypted note returned by the public release-view endpoint (feature 010)
        on a valid, unviewed, unexpired grant. Materialized in memory only at the moment of a
        valid open and never persisted outside the existing encrypted note; the grant's token is
        then burned (view-once).
      properties:
        note:
          type: string
          description: The note owner's decrypted note content, returned exactly once.
    TestReleaseResult:
      type: object
      additionalProperties: false
      required: [grants]
      description: >
        The outcome of a manual test-release (feature 010): how many one-time grants were minted
        and emailed to the caller's own verified address(es). The switch state is left unchanged.
      properties:
        grants:
          type: integer
          minimum: 0
          description: The number of grants created and emailed to the caller's own verified contacts.
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          examples: ["UNAUTHORIZED", "VALIDATION_ERROR", "CHANNEL_NOT_SUPPORTED"]
        message:
          type: string
          description: Human-readable explanation suitable for display.
    NotificationChannelType:
      type: string
      enum: [email, whatsapp, push]
      description: >
        A notification delivery channel. Only "email" is enabled in v1; "whatsapp" and
        "push" are reserved so the system and UI can present the extension point.
    ChannelField:
      type: object
      additionalProperties: false
      required: [name, label, type, required]
      description: One input a channel needs, so the test page can render its form dynamically.
      properties:
        name:
          type: string
          description: Field key (e.g. "recipient", "subject", "body", "bodyFormat").
        label:
          type: string
          description: Human label for the control.
        type:
          type: string
          enum: [email, text, textarea, select]
          description: The kind of control to render.
        required:
          type: boolean
        options:
          type: array
          items: { type: string }
          description: Allowed values for a "select" field (e.g. ["text", "html"]).
    ChannelInfo:
      type: object
      additionalProperties: false
      required: [type, label, available, fields]
      properties:
        type: { $ref: "#/components/schemas/NotificationChannelType" }
        label:
          type: string
          description: Display name for the channel (e.g. "Email").
        available:
          type: boolean
          description: True only for channels that can currently send (Email in v1).
        fields:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
          description: The inputs to render when this channel is selected.
    ChannelsResponse:
      type: object
      additionalProperties: false
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelInfo" }
    NotificationTestRequest:
      type: object
      additionalProperties: false
      required: [channel]
      description: >
        A request to send one notification to one recipient through one channel. The
        recipient/subject/body/bodyFormat fields are interpreted per channel (for Email,
        all four apply).
      properties:
        channel: { $ref: "#/components/schemas/NotificationChannelType" }
        recipient:
          type: string
          description: For Email, the destination email address.
        subject:
          type: string
          description: For Email, the message subject (1..200 chars after trimming).
        body:
          type: string
          description: For Email, the message body (1..10000 chars after trimming).
        bodyFormat:
          type: string
          enum: [text, html]
          description: For Email, whether the body is plain text or HTML (HTML is sanitized server-side).
    SendOutcome:
      type: object
      additionalProperties: false
      required: [status, channel]
      description: The explicit result of a delivery attempt (no request fails silently).
      properties:
        status:
          type: string
          enum: [sent, failed]
          description: '"sent" = accepted by the provider; "failed" = delivery was attempted but did not succeed.'
        channel: { $ref: "#/components/schemas/NotificationChannelType" }
        reason:
          type: string
          description: Present when status is "failed" — a human-readable failure reason.
        providerMessageId:
          type: string
          description: Present when status is "sent", if the provider returns an id.
    SendOutcomeResponse:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/SendOutcome" }
    DeadmanState:
      type: string
      enum: [disarmed, active, grace, triggered]
      description: >
        The current state of a user's dead-man switch. "disarmed" = off; "active" =
        armed and counting down; "grace" = a deadline was missed and the grace window is
        running (reminders sent to the user); "triggered" = the grace window also lapsed
        (in feature 008 this records the event; contact delivery is feature 010).
    DeadmanEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt]
      description: One append-only audit entry. `detail` never contains note plaintext or tokens.
      properties:
        id:
          type: string
          description: Server-assigned unique id for this event.
        type:
          type: string
          enum:
            [
              armed,
              disarmed,
              checkin,
              entered_grace,
              reminder_sent,
              triggered,
              released,
              config_changed,
            ]
          description: >
            The kind of transition or action recorded. `released` accompanies `triggered`
            when the fired switch creates a release and emails verified contacts (feature 010);
            its detail carries only a non-sensitive grant count, never a token or plaintext.
        detail:
          type: ["string", "null"]
          description: Optional JSON detail (never note plaintext or any token value).
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of when the event was recorded.
    DeadmanEventListResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeadmanEvent"
          description: The caller's recent events, newest-first (may be empty).
    DeadmanStatus:
      type: object
      additionalProperties: false
      required:
        [
          state,
          enabled,
          checkinIntervalSeconds,
          gracePeriodSeconds,
          lastCheckinAt,
          nextCheckinDueAt,
          graceDeadlineAt,
          secondsUntilDue,
          events,
        ]
      description: The caller's dead-man switch status, including a live countdown and recent events.
      properties:
        state: { $ref: "#/components/schemas/DeadmanState" }
        enabled:
          type: boolean
          description: Whether the switch is currently armed (enabled).
        checkinIntervalSeconds:
          type: integer
          description: The configured check-in interval, in seconds.
        gracePeriodSeconds:
          type: integer
          description: The configured grace period, in seconds.
        lastCheckinAt:
          type: ["string", "null"]
          format: date-time
          description: ISO 8601 timestamp of the last check-in/arm, or null if never.
        nextCheckinDueAt:
          type: ["string", "null"]
          format: date-time
          description: Absolute next-check-in deadline, or null when disarmed/triggered.
        graceDeadlineAt:
          type: ["string", "null"]
          format: date-time
          description: Absolute grace deadline (set in the grace state), or null otherwise.
        secondsUntilDue:
          type: ["integer", "null"]
          description: >
            Seconds until the relevant deadline (next-check-in while active, grace deadline
            while in grace), derived from the deadline and the current time; may be negative
            if a tick has not yet run, or null when there is no live deadline.
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeadmanEvent"
          description: The caller's recent events, newest-first (may be empty).
    DeadmanConfigInput:
      type: object
      additionalProperties: false
      required: [checkinIntervalSeconds, gracePeriodSeconds, enabled]
      description: Configure the switch and arm/disarm it.
      properties:
        checkinIntervalSeconds:
          type: integer
          minimum: 3600
          maximum: 31536000
          description: Check-in interval in seconds (1 hour to 365 days).
        gracePeriodSeconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: Grace period in seconds (1 hour to 30 days).
        enabled:
          type: boolean
          description: true arms the switch (→ active); false disarms it (→ disarmed).
