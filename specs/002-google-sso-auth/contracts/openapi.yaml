openapi: 3.1.0
info:
  title: Ensure API — Auth additions (Google SSO)
  version: 2.0.0
  description: >
    Authentication and access-protection additions for the note app (feature
    002-google-sso-auth). This contract documents the new /auth routes, the cookie-based
    security scheme, and the now-protected /note routes. It is merged into the runtime
    contracts/openapi.yaml during implementation. Sign-in is Google-only; the access token is a
    ~1h JWT carried in an httpOnly cookie, silently refreshed while the user is active, with a
    ~24h inactivity window.
servers:
  - url: /api
    description: API root (same-origin)

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        httpOnly, Secure, SameSite=Lax cookie holding the ~1h access-token JWT. Set by the Google
        callback (and by the test-login route in test mode), refreshed via POST /auth/refresh.
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          description: Stable Google subject identifier (sub).
        email:
          type: string
          format: email
        name:
          type: ["string", "null"]
          description: Optional display name from Google.
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          examples: ["UNAUTHORIZED", "VALIDATION_ERROR"]
        message:
          type: string
          description: Human-readable explanation suitable for display.

paths:
  /auth/google/start:
    get:
      operationId: authGoogleStart
      summary: Begin Google sign-in
      description: >
        Sets a short-lived signed httpOnly cookie carrying the OAuth `state` and PKCE
        code_verifier, then 302-redirects the browser to Google's consent screen. The
        "Sign in with Google" button links here. Accepts an optional `next` query param to
        return the user to their originally requested path after sign-in (FR-010).
      parameters:
        - in: query
          name: next
          required: false
          schema: { type: string }
          description: App-relative path to return to after successful sign-in.
      responses:
        "302":
          description: Redirect to Google's authorization endpoint.

  /auth/google/callback:
    get:
      operationId: authGoogleCallback
      summary: Google OAuth redirect target
      description: >
        Google redirects here with `code` and `state`. The server validates `state` against the
        handshake cookie, exchanges the code (PKCE) for tokens, verifies the ID token,
        provisions/looks up the user, issues the access + refresh cookies, and 302-redirects into
        the app (to `next` when present, else `/`). On failure, redirects to /login with an error
        flag (FR-013).
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
          description: Present when the user cancelled or Google denied the request.
      responses:
        "302":
          description: Redirect into the app on success, or back to /login on failure.

  /auth/me:
    get:
      operationId: authMe
      summary: Current authenticated user
      description: Returns the signed-in user, or 401 if there is no valid session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: No valid session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Silently refresh the access token
      description: >
        Reads the refresh-token cookie; if the backing session exists and has not expired
        (within the ~24h sliding inactivity window), rotates the refresh token, slides its expiry
        forward 24h, and issues a new ~1h access-token cookie. Otherwise returns 401 and the
        client routes the user to /login (FR-014, FR-017, SC-007, SC-008).
      responses:
        "204":
          description: New access (and rotated refresh) cookies set; no body.
        "401":
          description: Missing/expired/revoked refresh token — re-authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "UNAUTHORIZED", message: "Session expired. Please sign in again." }

  /auth/logout:
    post:
      operationId: authLogout
      summary: Sign out
      description: >
        Deletes the current server-side session and clears both auth cookies. Idempotent —
        returns 204 even if there was no active session (FR-012, SC-006).
      responses:
        "204":
          description: Session ended and cookies cleared.

  /note:
    get:
      operationId: getNote
      summary: Get the current note (now protected)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current note, or null if none exists. (Unchanged body shape.)
        "401":
          description: No valid access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }
    put:
      operationId: putNote
      summary: Create or replace the note (now protected)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The note was saved. (Unchanged body shape.)
        "400":
          description: Validation failed. (Unchanged.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: No valid access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "UNAUTHORIZED", message: "Sign in to continue." }

  /test/login:
    post:
      operationId: testLogin
      summary: "[TEST MODE ONLY] Mint a session for a fake user without contacting Google"
      description: >
        Mounted ONLY when AUTH_TEST_MODE=1 (never in production), mirroring the existing
        NOTE_ALLOW_TEST_RESET / POST /api/test/reset pattern. Issues the SAME access + refresh
        cookies as the real Google flow for a deterministic fake user, so end-to-end and contract
        tests can exercise the real authorization middleware and cookie handling without
        automating Google's consent screen. See research.md D6.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sub: { type: string, description: "Fake user id (default: e2e-user)." }
                email: { type: string, format: email }
                name: { type: ["string", "null"] }
      responses:
        "204":
          description: Access + refresh cookies set for the fake user.
        "404":
          description: Route is not mounted (AUTH_TEST_MODE is off).
