name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API types from the OpenAPI contract
        run: npm run gen:api

      - name: Type-check (all workspaces)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit / integration / component tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end acceptance tests
        run: npm run test:e2e
